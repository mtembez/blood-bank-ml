name: Blood Bank ML CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blood_bank
          POSTGRES_USER: jifunze
          POSTGRES_PASSWORD: jifunze
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Syntax & Compilation Verification
        run: |
          python -m py_compile manage.py
          python -m py_compile blood_bank/*.py
          python -m py_compile ml/*.py

      - name: Run Django Migrations
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
          DJANGO_DEBUG: "0"
          POSTGRES_DB: blood_bank
          POSTGRES_USER: jifunze
          POSTGRES_PASSWORD: jifunze
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python manage.py migrate

      - name: Run Deterministic Pytest Suite with Coverage
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
          DJANGO_DEBUG: "0"
          POSTGRES_DB: blood_bank
          POSTGRES_USER: jifunze
          POSTGRES_PASSWORD: jifunze
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          pytest -v --cov=apps --cov=ml --cov-report=term-missing --cov-report=xml --cov-fail-under=85
